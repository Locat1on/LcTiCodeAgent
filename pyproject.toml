[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lcti-code-agent"
version = "0.1.0"
description = "A from-scratch conversational coding agent with terminal and web UIs."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.68,<3",
    "rich>=13.7,<16",
    "starlette>=0.46,<1",
    "uvicorn>=0.34,<1",
    "websockets>=15,<16",
]

[project.scripts]
lcticode = "code_agent.cli:main"
lcticode-web = "code_agent.web:main"

[tool.setuptools.packages.find]
include = ["code_agent*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
code_agent = ["web_static/*"]
