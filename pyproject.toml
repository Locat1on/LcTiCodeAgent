[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lcti-code-agent"
version = "0.1.0"
description = "A from-scratch conversational coding agent for the terminal."
requires-python = ">=3.12"
dependencies = [
    "rich>=13.7,<16",
]

[project.scripts]
lcticode = "code_agent.cli:main"

[tool.setuptools.packages.find]
include = ["code_agent*"]

[tool.setuptools]
include-package-data = false
